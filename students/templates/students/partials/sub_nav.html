{# Rendered by {% sub_nav %} in students/templatetags/nav.py #}
<nav class="sub-nav-bar dm-subnav">
  <ul class="sub-nav-list">
    {% for item in items %}
    <li class="sub-nav-item">
      <a href="{{ item.href }}" class="sub-nav-link{% if item.active %} active{% endif %}">
        <i class="ph {{ item.icon }}"></i>
        {{ item.label }}
      </a>
    </li>
    {% endfor %}
  </ul>
</nav>
