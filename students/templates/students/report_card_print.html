{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% if student_marks_list.0 %}{{ student_marks_list.0.student.name }} — {{ selected_assessment|default:'' }} {{ selected_year|default:'' }}{% else %}Report Card{% endif %}</title>
<style>
@page { size: A4 portrait; margin: 5mm 5mm 8mm 5mm; }
@page { @bottom-center { content: "GENERATED FROM EDUNEXUS EXAM SYSTEM \00a9 2026"; font-family: "Times New Roman", Times, serif; font-size: 7pt; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.4pt; border-top: 0.5pt solid #cbd5e1; width: 70%; padding-top: 3pt; } @bottom-right { content: "Page " counter(page) " of " counter(pages); font-family: "Times New Roman", Times, serif; font-size: 7pt; font-weight: 700; color: #94a3b8; width: 28%; white-space: nowrap; } }

* { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; box-sizing: border-box; }

html, body {
    margin: 0 !important; padding: 0 !important;
    background: #fff !important;
    font-family: 'Times New Roman', Times, serif !important;
    font-size: 11pt !important;
    color: #1C1C1E !important;
    width: 100% !important;
}

.report-card {
    width: 100% !important;
    margin: 0 !important;
    padding: .18in .35in .20in .55in !important;
    border: none !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    position: relative !important;
    font-family: 'Times New Roman', Times, serif !important;
    font-size: 11pt !important;
    color: #1C1C1E !important;
    display: block !important;
    page-break-inside: avoid !important;
    background: white;
}
.report-card + .report-card { page-break-before: always !important; }
.report-card:last-child { page-break-after: auto !important; }

.report-card::before {
    content: '';
    display: block;
    position: absolute;
    left: 14px;
    top: 0;
    bottom: 0;
    width: 19px;
    background: {{ section_accent|default:'#305CDE' }};
    border-radius: 0 20px 20px 0;
    z-index: 1;
}

.report-content {
    width: 100%;
    margin: 0;
    padding: 0;
}

/* Header */
.rc-header {
    width: 100%;
    padding-bottom: 5px;
    margin-bottom: 4px;
    border-bottom: none;
    overflow: hidden;
}
.report-logo, .rc-logo-placeholder { width: 80px; height: 80px; float: left; margin-right: 14px; border-radius: 8px; object-fit: contain; }
.rc-logo-spacer { width: 80px; float: left; margin-right: 14px; }
.rc-schoolinfo { text-align: center; margin: 0 100px; }
.rc-schoolinfo h1 { font-family: 'Times New Roman', Times, serif; font-size: 16pt; font-weight: 900; margin: 0 0 4px; text-transform: uppercase; letter-spacing: 0.04em; line-height: 1.1; }
.rc-schoolinfo .rc-address { font-size: 10pt; font-weight: 600; margin-bottom: 2px; }
.rc-schoolinfo .rc-contact-line { font-size: 10pt; font-weight: 500; margin: 0; }

/* Banner */
.rc-banner {
    background: {{ section_accent|default:'#305CDE' }};
    color: #fff;
    text-align: center;
    font-size: 10pt;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 5px 14px;
    margin-left: -22px;
    margin-right: 20px;
    clear: both;
}

/* Student + Chart (float layout for WeasyPrint) */
.rc-top-grid {
    width: 100%;
    margin-top: 6px;
    overflow: hidden;
}
.rc-student-block { float: left; width: 35%; }
.rc-chart-block { float: right; width: 60%; max-height: 40mm; overflow: hidden; }
.rc-chart-block::after { content: ''; display: table; clear: both; }

.rc-initials-avatar {
    width: 80px; height: 90px; float: left; margin-right: 14px;
    background: {{ section_accent|default:'#305CDE' }}; color: #fff;
    text-align: center; line-height: 90px;
    font-family: 'Times New Roman', Times, serif; font-size: 28pt; font-weight: 800;
    border-radius: 8px;
}
.rc-student-name { font-family: 'Times New Roman', Times, serif; font-size: 13pt; font-weight: 800; margin-bottom: 6px; color: #1C1C1E; }
.rc-detail { font-size: 11pt; margin-bottom: 3px; color: #1C1C1E; line-height: 1.4; }
.rc-label { font-weight: 800; text-transform: uppercase; }

.rc-chart-title { font-size: 9pt; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 3px; }
.rc-chart-svg { width: 100%; margin: 4px 0; }
.rc-chart-svg svg { width: 100%; height: auto; max-height: 36mm; display: block; }
.rc-chart-img { width: 100%; max-height: 36mm; object-fit: contain; }

/* Stats (table layout for WeasyPrint) */
.rc-stats {
    width: 100%;
    border-collapse: collapse;
    margin: 6px 0;
}
.rc-stats td {
    width: 20%;
    border: 1px solid #E2E8F0;
    border-top: 3px solid {{ section_accent|default:'#305CDE' }};
    padding: 8px 6px;
    text-align: center;
    vertical-align: top;
}
.rc-stat-label {
    display: block;
    font-size: 8pt;
    font-weight: 800;
    color: {{ section_accent|default:'#305CDE' }};
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
}
.rc-stat-value {
    display: block;
    font-size: 14pt;
    font-weight: 800;
    color: #1E293B;
    line-height: 1.2;
}
.rc-stat-value small { font-size: 10pt; font-weight: 600; color: #94A3B8; }

/* Table */
.table-scroll { width: 100%; }
.rc-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.rc-table colgroup .col-subj { width: 32%; }
.rc-table colgroup .col-marks { width: 13%; }
.rc-table colgroup .col-dev { width: 18%; }
.rc-table colgroup .col-grade { width: 12%; }
.rc-table colgroup .col-teacher { width: 25%; }
.rc-table thead th {
    background: #E9ECF0; color: #1E293B;
    font-size: 9pt; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.03em; padding: 4px 6px; border: 1px solid #000;
    white-space: nowrap;
}
.rc-table thead th:first-child { text-align: left; }
.rc-table tbody tr { page-break-inside: avoid; }
.rc-table tbody td { padding: 3px 6px; border: 1px solid #000; font-size: 11pt; color: #1C1C1E; vertical-align: middle; }
.rc-subj { font-weight: 700; text-align: left; white-space: nowrap; }
.rc-center { text-align: center; }
.rc-grade { font-weight: 800; color: #2563EB; }
.rc-teacher { font-style: italic; font-weight: 600; padding-left: 10px; text-align: left; font-size: 11pt; }
.rc-table-cell-dev { padding: 3px 6px !important; }

/* Comments */
.rc-comments-header {
    background: {{ section_accent|default:'#305CDE' }};
    color: #fff;
    font-size: 10pt; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.06em; text-align: center;
    padding: 5px 14px;
    margin-left: -20px; margin-right: 20px;
    clear: both;
}
.rc-remarks-grid {
    width: 100%;
    border-collapse: collapse;
    margin-left: -20px; margin-right: 20px;
    margin-top: 0;
}
.rc-remarks-grid td {
    width: 50%;
    padding: 10px;
    background: #F8FAFC;
    vertical-align: top;
    border: 1px solid #E2E8F0;
}
.rc-remark-title { font-size: 11pt; font-weight: 800; color: #1E293B; margin-bottom: 6px; }
.rc-remark-text { font-size: 11pt; font-weight: 400; color: #334155; line-height: 1.4; margin-bottom: 6px; }
.rc-signature { font-size: 9pt; font-weight: 600; color: #64748B; border-top: 1px dashed #CBD5E1; padding-top: 4px; margin-top: auto; }

/* Descriptors */
.rc-descriptors { margin-top: 6px; width: 100%; }
.rc-descriptors-title { font-size: 9pt; font-weight: 800; color: #1E293B; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; padding-bottom: 4px; border-bottom: 2px solid {{ section_accent|default:'#305CDE' }}; }
.rc-descriptors-table { width: 100%; border-collapse: collapse; }
.rc-descriptors-table th, .rc-descriptors-table td { border: 1px solid #000; padding: 5px 8px; font-size: 9pt; text-align: center; }
.rc-descriptors-table th { background: #E9ECF0; color: #1E293B; font-weight: 800; text-transform: uppercase; }
.rc-descriptors-table td:first-child, .rc-descriptors-table th:first-child { text-align: left; font-weight: 700; background: #F8FAFC; }

/* Footer dates */
.footer-dates { width: 100%; border-collapse: collapse; margin-top: 8px; }
.footer-dates td { width: 50%; padding: 0 8px 0 0; vertical-align: top; }
.footer-dates td:last-child { padding: 0 0 0 8px; }
.date-box { display: block; padding: 8px 10px; border: 1px solid #E2E8F0; font-size: 11pt; font-weight: 700; color: #1E293B; overflow: hidden; }
.date-box span { display: inline; }
.date-box span:first-child { color: #64748B; text-transform: uppercase; letter-spacing: 0.04em; font-size: 9pt; float: left; }
.date-box span:last-child { float: right; }

* { transition: none !important; animation: none !important; }
</style>
</head>
<body>
<div id="reportCardsContainer">
{% for student_data in student_marks_list %}
{% include "students/report_card_content.html" %}
{% endfor %}
</div>
<script src="{% static 'js/edunexus_print.js' %}"></script>
<script>
(function() {
    var params = new URLSearchParams(window.location.search);
    if (params.get('view_mode') !== 'print') { return; }

    var CLOSED = false;

    function safeClose() {
        if (CLOSED) return;
        CLOSED = true;
        try { window.close(); } catch(e) {}
    }

    function firePrint() {
        try {
            window.focus();
            window.print();
            var called = false;
            function afterPrintDone() {
                if (called) return;
                called = true;
                setTimeout(safeClose, 500);
            }
            window.addEventListener('afterprint', afterPrintDone);
            try {
                var mql = window.matchMedia('print');
                if (mql && mql.addEventListener) {
                    mql.addEventListener('change', function(e) { if (!e.matches) afterPrintDone(); });
                } else if (mql && mql.addListener) {
                    mql.addListener(function(e) { if (!e.matches) afterPrintDone(); });
                }
            } catch(e2) {}
        } catch (e) {
            console.error('Auto-print failed:', e);
        }
    }

    function start() {
        requestAnimationFrame(function() {
            requestAnimationFrame(function() {
                setTimeout(firePrint, 600);
            });
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', start, { once: true });
    } else {
        start();
    }

    setTimeout(safeClose, 20000);
})();
</script>
</body>
</html>
