{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% if student_marks_list.0 %}{{ student_marks_list.0.student.name }} — {{ selected_assessment|default:'' }} {{ selected_year|default:'' }}{% else %}Report Card{% endif %}</title>
<base href="{{ request.scheme|default:'http' }}://{{ request.get_host|default:'localhost' }}/">
<link rel="stylesheet" href="{% static 'students/css/report_card_print.css' %}">
<style>
/* ── Minimal on-screen preview styles so the print preview also looks clean
       when the user previews Ctrl+P without closing the dashboard ── */
html, body { background: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; margin: 0; padding: 24px; }
.report-card { margin: 0 auto; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
/* When the user actually prints, the @media print rules in
   report_card_print.css take over and produce the single-sheet A4 output. */
@media print {
    html, body { background: white !important; padding: 0 !important; }
    .report-card { box-shadow: none !important; }
}
</style>
</head>
<body>
<div id="reportCardsContainer">
{% for student_data in student_marks_list %}
{% include "students/report_card_content.html" %}
{% endfor %}
</div>
<script>
/* ── Auto-print when this page is loaded with view_mode=print ──
   The dashboard's Print button opens this page in a new tab with
   view_mode=print appended to the URL. This script fires window.print()
   once the chart canvases and SVGs have rendered, then closes the tab
   via the cross-browser-safe `afterprint` event.
   ───────────────────────────────────────────────────────────── */
(function() {
    var params = new URLSearchParams(window.location.search);
    if (params.get('view_mode') !== 'print') { return; }

    function firePrint() {
        try {
            window.focus();
            window.print();
            window.addEventListener('afterprint', function() {
                // Give the print spooler ~500ms to flush before closing.
                setTimeout(function() { window.close(); }, 500);
            });
        } catch (e) {
            console.error('Auto-print failed:', e);
        }
    }

    // Two RAF ticks give Chart.js a chance to paint, then 600ms more for
    // any final canvas rendering / SVG layout reflow. Independent of
    // window.load so it fires on the same tick the body is parsed.
    function start() {
        requestAnimationFrame(function() {
            requestAnimationFrame(function() {
                setTimeout(firePrint, 600);
            });
        });
    }

    // Fire as soon as the DOM is ready; don't depend on window.load (it can
    // stall waiting for canvas bitmaps in some browsers).
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', start, { once: true });
    } else {
        start();
    }
})();
</script>
</body>
</html>
