<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Analysis Report</title>
<style>
@page{
  size:landscape;
  margin:12mm 15mm 18mm 15mm;
  @bottom-center{
    content:"Page " counter(page) " of " counter(pages);
    font-size:9px;color:#64748b;font-family:'Helvetica','Arial',sans-serif;
  }
  @bottom-left{
    content:"{{ watermark_text|default:'EduNexus Exam System' }}";
    font-size:8px;color:#94a3b8;font-family:'Helvetica','Arial',sans-serif;
  }
  @bottom-right{
    content:"{{ watermark_text|default:'EduNexus Exam System' }}";
    font-size:8px;color:#94a3b8;font-family:'Helvetica','Arial',sans-serif;
  }
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Helvetica','Arial',sans-serif;font-size:11px;color:#1e293b;line-height:1.4;position:relative}
body::before{
  content:"";
  position:fixed;
  bottom:40%;
  left:50%;
  transform:translate(-50%,-50%) rotate(-35deg);
  font-size:80px;
  font-weight:800;
  color:rgba(0,0,0,0.03);
  white-space:nowrap;
  pointer-events:none;
  z-index:0;
  font-family:'Helvetica','Arial',sans-serif;
  letter-spacing:8px;
  text-transform:uppercase;
}
.hdr-accent{height:6px;background:#1e3a5f}
.school-hdr{display:flex;align-items:center;padding:6mm 0 3mm;border-bottom:2px solid #1e3a5f;position:relative;z-index:1}
.school-logo{width:60px;height:60px;object-fit:contain;margin-right:12px}
.school-info{text-align:center;flex:1}
.school-name{font-size:20px;font-weight:800;color:#1e3a5f;letter-spacing:2px;text-transform:uppercase}
.school-motto{font-size:10px;color:#475569;letter-spacing:1.5px;margin-top:2px}
.school-addr{font-size:10px;color:#475569;margin-top:2px}
.school-contact{font-size:10px;color:#475569;margin-top:1px}
.exam-banner{background:#1e293b;color:#fff;padding:6px 16px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-top:4mm}
.summary-row{display:flex;gap:16px;padding:4mm 0;border-bottom:1px solid #e5e7eb}
.summary-left{flex:1}
.summary-means{display:flex;gap:20px;margin-bottom:4px}
.mean-box .lbl{font-size:9px;color:#64748b;text-transform:uppercase;font-weight:600}
.mean-box .val{font-size:22px;font-weight:800;color:#0f172a}
.mean-box .chg{font-size:10px;font-weight:700}
.mean-box .chg.up{color:#16a34a}.mean-box .chg.down{color:#ea580c}.mean-box .chg.neutral{color:#94a3b8}
.summary-right{text-align:center;flex:0 0 120px}
.summary-right .lbl{font-size:9px;color:#64748b;text-transform:uppercase;font-weight:600}
.summary-right .val{font-size:28px;font-weight:800;color:#0f172a}
.summary-right .sub{font-size:9px;color:#64748b}
.section-title{background:#1e293b;color:#fff;padding:5px 12px;font-size:11px;font-weight:700;text-transform:uppercase;margin:4mm 0 2mm}
table{width:100%;border-collapse:collapse;font-size:10px;margin-bottom:3mm}
th{background:#f1f5f9;color:#334155;font-weight:700;padding:4px 6px;border:1px solid #cbd5e1;text-align:left;font-size:9px}
td{padding:3px 6px;border:1px solid #e2e8f0;text-align:center}
td:first-child{text-align:left;font-weight:600}
tr:nth-child(even){background:#f8fafc}
tr.total-row{background:#e2e8f0;font-weight:700}
tr.best-row{background:#dcfce7;font-weight:700}
.subject-banner{background:#94a3b8;color:#fff;padding:4px 10px;font-size:10px;font-weight:700;text-transform:uppercase;margin:3mm 0 1mm}
.page-break{page-break-before:always}
</style>
</head>
<body>
{{ html_content|safe }}
</body>
</html>
